name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff mypy pytest
      - run: ruff check evals/
      - run: mypy evals/ --ignore-missing-imports
      - name: pytest (allow exit 5 = no tests yet)
        run: |
          set +e
          pytest evals/
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 5 ]; then exit 0; fi
          exit $rc
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: './hooks'
